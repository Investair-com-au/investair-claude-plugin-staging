name: Schema scan

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  schema-scan:
    name: No data-model identifiers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # CHANNEL.md is excluded because it documents the forbidden patterns.
      # describe_table / list_allowed_tables are not blocked yet: sector-report
      # still instructs runtime schema discovery. Add them once that is removed.
      - name: Fail on SQL, table names or data-lake paths
        run: |
          PATTERN='(ASX_Market|Cashflow|Placement|Broker|Feed_Public|ATM_Screening)\.[A-Za-z_]+|\bSELECT\b|\bFROM[[:space:]]+[A-Z][A-Za-z_]*\.|s3://|databricks'
          if grep -rInE "$PATTERN" . \
               --exclude-dir=.git \
               --exclude-dir=.github \
               --exclude=CHANNEL.md; then
            echo "::error::Data-model identifiers found. This repository is publicly readable - SQL, table names and data-lake paths must stay in the private plugin. See CHANNEL.md."
            exit 1
          fi
          echo "Clean: no data-model identifiers."
